name: CI

# Linux only, deliberately (AGENTS.md: do NOT set up macOS runners). macOS is
# the development platform and is exercised by `make test` on the laptop; a
# hosted macOS runner bills at ~10x the Linux rate for coverage that is never
# in doubt here. The one job builds the shim against system libuv, resolves all
# four pinned dependencies onto one library path, builds vtest2 for the
# black-box lane, fetches oha for the load smoke, and runs the suite.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# README.org's declared Chez floor. The job asserts the Chez it ends up with
# actually meets this rather than trusting the resolution step.
env:
  CHEZ_FLOOR_VERSION: "10.4.1"

jobs:
  linux:
    name: linux
    # An explicit image, not ubuntu-latest: that label moves from one Ubuntu
    # release to the next, and an image change should be a reviewed commit.
    # Changing it re-keys the Chez cache (step `os`).
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # This repository alone; `make submodules` clones the submodules below.
      - uses: actions/checkout@v7

      # libuv for the shim (pkg-config path); the X11/ncurses/uuid headers are
      # what Chez's from-source build needs; curl and ab (apache2-utils) are
      # the real clients tests/test-clients.sps runs against the server, and
      # pcre2, zlib and python3 what `make vtest` builds the third with.
      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config libuv1-dev \
            libx11-dev libncurses-dev uuid-dev git \
            curl apache2-utils libpcre2-dev zlib1g-dev python3

      # The OS release for the Chez cache key, read off the machine rather than
      # restated from runs-on (which a bump could forget), so a new image misses
      # the cache instead of restoring a Chez built against another release's
      # libraries. An empty ID or VERSION_ID fails the step.
      - name: Identify the OS release
        id: os
        run: |
          . /etc/os-release
          echo "release=${ID:?}-${VERSION_ID:?}" >> "$GITHUB_OUTPUT"

      # apt's chezscheme is below the floor, so build 10.4.1 from source and
      # cache it keyed on the exact version and OS release (a change to either
      # must miss, not merge).
      - name: Restore cached Chez Scheme
        id: chez-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.local/chez
          key: chez-${{ runner.os }}-${{ steps.os.outputs.release }}-${{ runner.arch }}-${{ env.CHEZ_FLOOR_VERSION }}-threads

      - name: Build Chez Scheme from source (apt's is below the floor)
        if: steps.chez-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "v${CHEZ_FLOOR_VERSION}" \
            https://github.com/cisco/ChezScheme.git "${RUNNER_TEMP}/ChezScheme"
          cd "${RUNNER_TEMP}/ChezScheme"
          ./configure --threads --installprefix="${HOME}/.local/chez"
          make -j"$(nproc)"
          make install

      # Saved here, not by the cache action's post-step, so a failed later step
      # never publishes a half-installed prefix under the key.
      - name: Save built Chez Scheme
        if: steps.chez-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.local/chez
          key: ${{ steps.chez-cache.outputs.cache-primary-key }}

      - name: Put Chez on PATH
        run: echo "${HOME}/.local/chez/bin" >> "${GITHUB_PATH}"

      # The from-source install names its binary `scheme`; the Makefile
      # defaults CHEZ to `chez`. Resolve whichever exists into the environment
      # so every later `make` step uses it.
      - name: Resolve the Chez binary
        run: |
          if command -v chez >/dev/null; then echo "CHEZ=chez" >> "$GITHUB_ENV"
          elif command -v chezscheme >/dev/null; then echo "CHEZ=chezscheme" >> "$GITHUB_ENV"
          elif command -v scheme >/dev/null; then echo "CHEZ=scheme" >> "$GITHUB_ENV"
          else echo "no Chez Scheme binary found" >&2; exit 1; fi

      - name: Assert Chez meets the declared floor
        run: |
          raw="$($CHEZ --version 2>&1)"
          ver="$(echo "$raw" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)"
          [ -n "$ver" ] || { echo "::error::could not parse a Chez version from '$raw'"; exit 1; }
          lowest="$(printf '%s\n%s\n' "$ver" "$CHEZ_FLOOR_VERSION" | sort -V | head -1)"
          [ "$lowest" = "$CHEZ_FLOOR_VERSION" ] || { echo "::error::Chez $ver is below the floor $CHEZ_FLOOR_VERSION"; exit 1; }
          echo "Chez $ver satisfies the $CHEZ_FLOOR_VERSION floor"

      - name: Report versions
        run: |
          $CHEZ --version 2>&1 || true
          cmake --version | head -1
          echo "libuv: $(pkg-config --modversion libuv)"

      # Clone the submodules, chez-httparse's byte-machine included, then
      # verify every gitlink is at its pin before building anything. Targeted,
      # so chez-libuv's own vendored libuv is not cloned: the system libuv
      # installed above is what the shim links. Every submodule is public, so
      # no token is needed, and a pull request from a fork, which gets no
      # secrets, builds as one from this repository does. Build and Test run
      # `make submodules` again (deps needs it); every gitlink is at its pin
      # by then, so git fetches nothing.
      - name: Init submodules
        run: make submodules

      - name: Check dependency pins
        run: make check-pins

      # vtest2, the black-box lane's client, is built from its
      # pin and cached as Chez is, keyed on the gitlink read off the tree, the
      # OS release and the arch, so a pin or an image change misses. Its
      # stamp, build/vtest.pin, names the commit it was built from, so `make
      # test` takes a restored binary as built.
      - name: Identify the vtest2 pin
        id: vtest-pin
        run: |
          commit="$(git rev-parse HEAD:vendor/vtest2)"
          echo "commit=${commit:?}" >> "$GITHUB_OUTPUT"

      - name: Restore cached vtest
        id: vtest-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            build/vtest
            build/vtest.pin
          key: vtest-${{ runner.os }}-${{ steps.os.outputs.release }}-${{ runner.arch }}-${{ steps.vtest-pin.outputs.commit }}

      - name: Build vtest
        if: steps.vtest-cache.outputs.cache-hit != 'true'
        run: make vtest

      # Saved here, not by the cache action's post-step, as Chez is: only a
      # build that finished is saved under the key.
      - name: Save built vtest
        if: steps.vtest-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            build/vtest
            build/vtest.pin
          key: ${{ steps.vtest-cache.outputs.cache-primary-key }}

      # oha, the load smoke's client: the release binary of
      # the version tests/fetch-oha.sh pins, kept only if its sha256 is the
      # one pinned beside it. It takes about a second, so it is not cached.
      - name: Fetch oha
        run: make oha

      - name: Build
        run: make build

      - name: Test
        run: make test

      - name: Check help is complete
        run: make check-help
