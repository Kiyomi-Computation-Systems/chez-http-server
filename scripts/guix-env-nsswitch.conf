# The container's name service switch. scripts/guix-env mounts it over
# /etc/nsswitch.conf, which `guix shell --network` otherwise takes from the
# host. A host's file may name modules (mdns4_minimal, myhostname, systemd)
# that the container's glibc cannot load, and then every name that does not
# resolve fails as EAI_SYSTEM, not EAI_NONAME. This names only modules
# glibc carries.
passwd:    files
group:     files
shadow:    files
hosts:     files dns
networks:  files
protocols: files
services:  files
ethers:    files
rpc:       files
